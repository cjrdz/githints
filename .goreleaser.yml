version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: githints
    main: .
    binary: githints
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    format_overrides:
      - goos: windows
        formats: ["zip"]
    files:
      - LICENSE
      - README.md
      - docs/usage.md

# Native packages, so githints can be installed with the system package manager
# rather than by unpacking a tarball onto PATH by hand.
#
# These need no credentials and no second repository: goreleaser builds them
# and attaches them to the release, so `pacman -U`, `dpkg -i` and `rpm -i` all
# work off a downloaded file. A Homebrew tap, a Scoop bucket or a real AUR
# package each need a separate repository and a token, which is why they are
# not here.
#
# The install location matters: these put the binary at /usr/bin/githints, a
# stable path that survives upgrades. `githints init` records the binary's path
# in each repository's git hooks, and while those hooks now fall back to PATH,
# not needing the fallback is better.
nfpms:
  - id: githints
    package_name: githints
    vendor: cjrdz
    homepage: https://github.com/cjrdz/githints
    maintainer: cjrdz <noreply@github.com>
    description: |-
      Local change log and structural index for AI coding agents.
      Records what changed and why per file, and exposes it over MCP or a CLI.
    license: Apache-2.0
    formats:
      - deb
      - rpm
      - apk
      - archlinux
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/licenses/githints/LICENSE
      - src: README.md
        dst: /usr/share/doc/githints/README.md
      - src: docs/usage.md
        dst: /usr/share/doc/githints/usage.md
    # git is not a hard dependency of the binary, but githints shells out to it
    # for every operation that matters, so a package without it is broken.
    dependencies:
      - git

checksum:
  name_template: "checksums.txt"

# No `sboms:` block on purpose. A static pure-Go binary already carries its
# dependency graph: `go version -m githints` lists every module with its version
# and h1: hash, and `govulncheck -mode=binary` scans the shipped artifact
# directly. An SBOM would be a less convenient copy of that, at the cost of six
# extra release assets and an unpinned syft install script in the workflow whose
# whole purpose is supply-chain integrity. The provenance attestation stays,
# because build origin is the one thing the binary cannot self-report.

snapshot:
  version_template: "{{ .Tag }}-next"

release:
  # The annotated tag's body becomes the top of the release notes, so a
  # per-release upgrade warning is written once — in the tag — instead of being
  # bolted on afterwards with `gh release edit`.
  header: |
    {{ with .TagBody }}{{ . }}

    {{ end }}

changelog:
  # Deliberately the default `git` backend rather than `github`: the latter
  # calls the compare API, so it needs a live token and network at release time
  # and fails the whole release when either is missing. Grouping below is what
  # actually makes the notes readable, and it works offline.
  sort: asc
  # 40-char SHAs made the v0.1.1 notes unreadable.
  abbrev: 7
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Security
      regexp: '^.*?sec(urity)?(\(.+\))??!?:.+$'
      order: 2
    - title: Others
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^Merge pull request"
      - "^Merge branch"
