name: CI

# dev is included so work merges into it under the same gates as main.
# Without it, a PR targeting dev runs no checks at all.
#
# workflow_call lets release.yml gate publishing on these same jobs instead of
# duplicating them. A tag push matches no `branches:` filter, so tagging does
# not start a second, redundant CI run.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_call:

# Least privilege by default; no job here needs write access.
permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Follow go.mod so the toolchain cannot drift from what the module
          # actually requires.
          go-version-file: go.mod

      - name: gofmt
        shell: bash
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "gofmt would reformat the following files:"
            gofmt -l .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race ./...

      - name: go build
        run: go build ./...

      # The install scripts are what most people will run before they ever run
      # githints, and they are piped straight into a shell, so a syntax error
      # is a broken install rather than a failed build. Each is checked on the
      # platform that actually runs it.
      - name: Check install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "install.ps1 parses"

      - name: Check install.sh
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sh -n install.sh
          echo "install.sh parses"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
