<header>
  <h1>githints · dependency graph</h1>
  <span class="stats" id="stats"></span>
  <span class="warn" id="truncated" hidden></span>
  <div class="controls">
    <input type="search" id="search" placeholder="Find a file  ( / )" aria-label="Find a file" autocomplete="off">
    <span class="stats" id="match-count" aria-live="polite"></span>
    <label>Layout
      <select id="layout">
        <option value="layers">layers</option>
        <option value="force">force</option>
      </select>
    </label>
    <label>Color by
      <select id="color-by">
        <option value="folder">folder</option>
        <option value="language">language</option>
        <option value="facet">framework role</option>
      </select>
    </label>
    <button type="button" id="toggle-group" aria-pressed="false" title="Collapse each folder into one node; click a folder to open it">Group folders</button>
    <button type="button" id="toggle-tests" aria-pressed="false" title="Show test files, imports made only by tests, and helpers only tests import">Tests</button>
    <button type="button" id="toggle-labels" aria-pressed="true">Labels</button>
    <button type="button" id="toggle-table" aria-pressed="false">Table</button>
    <button type="button" id="fit">Fit</button>
  </div>
</header>
<main>
  <div id="stage">
    <canvas id="graph" aria-label="File dependency graph. Use the Table button for an accessible list."></canvas>
    <div id="legend" aria-label="Legend"></div>
    <div id="tooltip" hidden></div>
    <div id="table-view" hidden>
      <table>
        <thead><tr>
          <th><button type="button" data-key="name">File</button></th>
          <th><button type="button" data-key="language">Language</button></th>
          <th class="num"><button type="button" data-key="in">Imported by</button></th>
          <th class="num"><button type="button" data-key="out">Imports</button></th>
          <th class="num"><button type="button" data-key="symbols">Symbols</button></th>
        </tr></thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
  </div>
  <aside id="panel" aria-live="polite"></aside>
</main>
